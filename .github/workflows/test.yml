name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    # 同时跑 Windows 和 macOS：证明这套靶场不依赖某个操作系统的特殊行为
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show versions
        run: python -c "import can, isotp, cantools, doipclient, scapy, pytest; print('python-can', can.__version__); print('can-isotp', isotp.__version__); print('cantools', cantools.__version__); print('scapy', scapy.__version__); print('pytest', pytest.__version__)"

      - name: Run tests
        env:
          PYTHONUTF8: '1'
        run: pytest -v

      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
